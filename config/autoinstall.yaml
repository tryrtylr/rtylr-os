#cloud-config
# Rtylr OS initial appliance installer. No production secrets belong here.
# __RTYLR_*__ placeholders are rendered by scripts/build.sh.
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Etc/UTC
  shutdown: __RTYLR_SHUTDOWN__
  identity:
    hostname: rtylr-pos
    username: rtylr
    # Replaced by the build with RTYLR_INSTALL_PASSWORD_HASH.
    password: "__RTYLR_INSTALL_PASSWORD_HASH__"
  ssh:
    install-server: false
  storage:
    layout:
      name: direct
  # Generated from config/packages.list (single source of truth).
  packages: __RTYLR_PACKAGES__
  # late-commands run in the installer environment, not the target chroot, so
  # /cdrom is visible and the target filesystem lives under /target.
  late-commands:
    - mkdir -p /target/opt/rtylr/config /target/opt/rtylr/pos /target/opt/rtylr/agent /target/var/lib/rtylr /target/usr/local/lib/rtylr /target/usr/share/xsessions /target/etc/lightdm/lightdm.conf.d /target/usr/lib/sysusers.d
    - install -m 0644 /cdrom/rtylr-config/packages.list /target/opt/rtylr/config/packages.list
    - install -m 0755 /cdrom/rtylr-config/kiosk/session.sh /target/usr/local/lib/rtylr/session.sh
    - install -m 0644 /cdrom/rtylr-config/kiosk/rtylr-kiosk.desktop /target/usr/share/xsessions/rtylr-kiosk.desktop
    - install -m 0644 /cdrom/rtylr-config/kiosk/autologin.conf /target/etc/lightdm/lightdm.conf.d/50-rtylr-autologin.conf
    - install -m 0644 /cdrom/rtylr-config/sysusers/rtylr.conf /target/usr/lib/sysusers.d/rtylr.conf
    - install -m 0644 -t /target/etc/systemd/system /cdrom/rtylr-config/systemd/rtylr-agent.service /cdrom/rtylr-config/systemd/rtylr-firstboot.service
    - install -m 0755 /cdrom/scripts/first-boot.sh /target/usr/local/lib/rtylr/first-boot.sh
    - curtin in-target -- systemd-sysusers /usr/lib/sysusers.d/rtylr.conf
    - curtin in-target -- chown rtylr-agent:rtylr-agent /opt/rtylr/config
    - curtin in-target -- systemctl enable rtylr-firstboot.service
    - curtin in-target -- systemctl enable rtylr-agent.service
    - curtin in-target -- systemctl enable NetworkManager
    - curtin in-target -- systemctl enable lightdm
    # __RTYLR_EXTRA_LATE_COMMANDS__
