#cloud-config
# Rtylr OS appliance installer. No production secrets belong here.
# Placeholders in double underscores are rendered by scripts/build.sh.
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Etc/UTC
  shutdown: __RTYLR_SHUTDOWN__
  identity:
    hostname: rtylr-business
    username: rtylr
    # The public build locks password login; deployments may inject a crypt hash.
    password: "__RTYLR_INSTALL_PASSWORD_HASH__"
  ssh:
    install-server: false
  storage:
    layout:
      name: direct
  # Generated from config/packages.list (single source of truth).
  packages: __RTYLR_PACKAGES__
  late-commands:
    - install -d -m 0755 /target/opt/rtylr/config /target/opt/rtylr/shell /target/opt/rtylr/apps /target/opt/rtylr/agent /target/usr/local/lib/rtylr /target/etc/lightdm/lightdm.conf.d /target/etc/polkit-1/rules.d /target/etc/logrotate.d /target/etc/xdg/openbox /target/usr/share/xsessions
    - install -d -m 0750 /target/var/lib/rtylr /target/var/log/rtylr
    - cp -a /cdrom/rtylr-shell/. /target/opt/rtylr/shell/
    - install -m 0755 /cdrom/rtylr-shell/rtylr-shell /target/usr/local/bin/rtylr-shell
    - install -m 0644 /cdrom/rtylr-config/shell.json /target/opt/rtylr/config/shell.json
    - install -m 0644 /cdrom/rtylr-config/packages.list /target/opt/rtylr/config/packages.list
    - install -m 0755 /cdrom/rtylr-config/kiosk/session.sh /target/usr/local/lib/rtylr/session.sh
    - install -m 0644 /cdrom/rtylr-config/kiosk/rtylr.desktop /target/usr/share/xsessions/rtylr.desktop
    - install -m 0644 /cdrom/rtylr-config/kiosk/openbox.xml /target/etc/xdg/openbox/rc.xml
    - install -m 0644 /cdrom/rtylr-config/kiosk/autologin.conf /target/etc/lightdm/lightdm.conf.d/50-rtylr-autologin.conf
    - install -m 0644 /cdrom/rtylr-config/polkit/49-rtylr-appliance.rules /target/etc/polkit-1/rules.d/49-rtylr-appliance.rules
    - install -m 0644 /cdrom/rtylr-config/logrotate/rtylr /target/etc/logrotate.d/rtylr
    - install -m 0644 /cdrom/rtylr-version /target/etc/rtylr-release
    - cp /cdrom/rtylr-config/systemd/*.service /target/etc/systemd/system/
    - install -m 0755 /cdrom/scripts/first-boot.sh /target/usr/local/lib/rtylr/first-boot.sh
    - curtin in-target -- install -d -m 0755 -o rtylr -g rtylr /home/rtylr/.config/openbox
    - curtin in-target -- cp /etc/xdg/openbox/rc.xml /home/rtylr/.config/openbox/rc.xml
    - curtin in-target -- chown -R rtylr:rtylr /home/rtylr/.config /var/lib/rtylr /var/log/rtylr
    - curtin in-target -- systemctl enable rtylr-firstboot.service
    - curtin in-target -- systemctl enable rtylr-agent.service
    - curtin in-target -- systemctl enable NetworkManager
    - curtin in-target -- systemctl enable lightdm
    # __RTYLR_EXTRA_LATE_COMMANDS__
