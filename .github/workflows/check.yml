name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install configuration validator
        run: python -m pip install PyYAML
      - name: Validate source and run unit tests
        run: make check
